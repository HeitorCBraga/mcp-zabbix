# Conecta o Grafana ao Zabbix do docker-compose (plugin alexanderzobnin-zabbix-app).
apiVersion: 1

datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    uid: zabbix
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    jsonData:
      username: Admin
      trends: true
    secureJsonData:
      password: zabbix
